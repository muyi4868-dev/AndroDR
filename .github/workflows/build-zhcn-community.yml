name: Build zh-CN Community APK

on:
  workflow_dispatch:
  push:
    branches: [ "zhcn-community" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build community debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AndroDR-zhCN-Community-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroDR-zhCN-Community-debug
          path: AndroDR-zhCN-Community-debug.apk
          if-no-files-found: error
